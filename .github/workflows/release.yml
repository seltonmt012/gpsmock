# Baut die signierte APK, legt das GitHub-Release an und zeigt update.json darauf.
#
# Vorher in app/build.gradle.kts versionCode UND versionName hochzählen, dann hier
# unter Actions -> Release -> "Run workflow" die Änderungen eintippen. Das ist der
# gleiche Ablauf wie publish.ps1, nur auf GitHubs Rechnern statt auf deinem.
#
# Benötigt vier Repository-Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD. Ohne sie wäre der Build unsigniert und das Handy
# würde die Installation verweigern, weil die Signatur nicht zur installierten passt.

name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Was hat sich geändert? Steht so im Update-Dialog der App."
        required: true
        default: "Wartungsupdate."

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Version aus build.gradle.kts lesen
        id: version
        run: |
          set -euo pipefail
          code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "Release v$name (versionCode $code)"

      # Ein Tag, den es schon gibt, heißt: die Version wurde nicht hochgezählt.
      # Trotzdem zu veröffentlichen würde installierte Apps auf eine APK zeigen
      # lassen, die sie längst haben - das Update käme dann endlos wieder.
      - name: Doppeltes Release abfangen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG existiert schon. versionCode und versionName in app/build.gradle.kts hochzählen."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK bereitstellen
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Signaturmaterial herstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/gpsmock.jks
          # Der Build liest genau diese Datei; Pfad ist relativ zum Projektwurzelverzeichnis.
          {
            echo "storeFile=keystore/gpsmock.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Ohne diese Prüfung könnte eine unsigniert durchgerutschte APK veröffentlicht
      # werden, die sich auf keinem Handy installieren lässt.
      - name: Signatur prüfen
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk GpsMock.apk
          gh release create "$TAG" GpsMock.apk --title "$TAG" --notes "$NOTES"

      # Erst hiernach sehen installierte Apps das Update: sie fragen ausschließlich
      # update.json auf main ab.
      - name: update.json auf das Release zeigen lassen
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          jq -n \
            --argjson versionCode "$CODE" \
            --arg versionName "$NAME" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/GpsMock.apk" \
            --arg notes "$NOTES" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, notes: $notes}' \
            > update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Release $TAG"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Signaturmaterial wegräumen
        if: always()
        run: rm -f keystore/gpsmock.jks keystore.properties
